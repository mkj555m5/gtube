name: Android CI

# Simple, reliable Android CI for a large Compose app:
# - Two parallel build jobs (debug / nightly) so each gets its own runner
#   and the heavy R8 pass never pushes a combined build past the timeout.
# - A lightweight publish job rolls both APKs into a permanent "ci-latest"
#   GitHub Release with a direct download link.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: >
          ./gradlew :app:assembleGithubDebug
          --parallel --build-cache --stacktrace

      - name: Collect debug APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/github/debug/app-github-universal-debug.apk dist/gtube-debug.apk
          sha256sum dist/gtube-debug.apk

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtube-debug-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  build-nightly:
    name: Build Nightly APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build nightly APK
        run: >
          ./gradlew :app:assembleGithubNightly
          --parallel --build-cache --stacktrace

      - name: Collect nightly APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/github/nightly/app-github-universal-nightly.apk dist/gtube-nightly.apk
          sha256sum dist/gtube-nightly.apk

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtube-nightly-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish ci-latest Release
    needs: [ build-debug, build-nightly ]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download debug artifact
        uses: actions/download-artifact@v4
        with:
          name: gtube-debug-apk
          path: dist

      - name: Download nightly artifact
        uses: actions/download-artifact@v4
        with:
          name: gtube-nightly-apk
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum gtube-*.apk > checksums.txt
          ls -lh

      - name: Publish to rolling "ci-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ci-latest
        run: |
          set -euo pipefail
          cat > release-body.md <<'EOF'
          بناء تلقائي (CI) من فرع `main` — commit ${SHA}

          ## ملفات التحميل
          | الملف | الوصف |
          |---|---|
          | `gtube-nightly.apk` | النسخة الموصى بها — أداء كامل (R8)، عالمية لكل المعالجات، موقّعة بمفتاح تصحيح وقابلة للتثبيت مباشرة |
          | `gtube-debug.apk` | نسخة التصحيح (Debug) لأغراض التجربة والتطوير، تُثبّت بجانب النسخة الرسمية |

          > كلا النسختين universal وتعملان على جميع المعالجات (arm64 / armv7 / x86 / x86_64).
          > يُحدَّث هذا الإصدار تلقائياً مع كل بناء ناجح.
          EOF
          sed -i "s/\${SHA}/${GITHUB_SHA::7}/" release-body.md
          gh release create "$TAG" \
            --prerelease \
            --title "أحدث بناء تلقائي (CI)" \
            --notes-file release-body.md 2>/dev/null || true
          gh release upload "$TAG" dist/gtube-debug.apk dist/gtube-nightly.apk dist/checksums.txt --clobber

      - name: Write download links to summary
        run: |
          {
            echo '## روابط التحميل المباشرة'
            echo
            echo "- **Nightly APK:** ${{ github.server_url }}/${{ github.repository }}/releases/download/ci-latest/gtube-nightly.apk"
            echo "- **Debug APK:** ${{ github.server_url }}/${{ github.repository }}/releases/download/ci-latest/gtube-debug.apk"
            echo "- **صفحة الإصدار:** ${{ github.server_url }}/${{ github.repository }}/releases/tag/ci-latest"
          } >> "$GITHUB_STEP_SUMMARY"
